}.inspector h3{margin-bottom:10px}.agent-card{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;position:relative}.agent-card.running{border-color:#92b4eb}.agent-card p{font-size:12px;color:var(--muted);margin:8px 0}.agent-card small{font-size:11px}.stage-line{height:3px;background:var(--muted-surface);overflow:hidden;border-radius:3px;margin-top:10px}.stage-line i{display:block;width:34%;height:100%;background:var(--accent);transform:translateX(0)}.running .stage-line i{animation:activity 1.6s var(--ease) infinite}.working-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}.agent-card.changed{animation:state-arrive .22s var(--ease)}@keyframes activity{from{transform:translateX(-100%)}to{transform:translateX(390%)}}@keyframes pulse{50%{opacity:.35}}@keyframes state-arrive{from{opacity:.7;transform:translateY(3px)}to{opacity:1;transform:none}}.demo-tools{padding-top:12px;border-top:1px solid var(--line);margin-top:16px}.demo-tools button{font-size:12px;margin-top:6px;min-height:32px}.demo-tools p{font-size:12px;margin:6px 0;color:var(--muted)}details{font-size:12px;margin-top:10px;color:var(--muted)}summary{cursor:pointer}details p{margin-top:5px;overflow-wrap:anywhere}.page{overflow:auto;padding:24px;flex:1;min-height:0}.page-head{margin-bottom:20px}.page-head p{color:var(--muted);font-size:13px;margin-top:6px}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.filters input[type=search]{width:min(320px,100%)}.agent-table{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}.discovery-row{display:grid;grid-template-columns:26px minmax(140px,1.1fr) minmax(140px,1.1fr) 145px auto;gap:12px;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.discovery-row:last-child{border:0}.discovery-row strong,.discovery-row small{display:block}.selection-bar{padding:10px 12px;background:var(--blue-soft);margin-bottom:12px;border-radius:7px;display:flex;align-items:center;gap:9px}.config-panel{max-width:740px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:18px}.config-panel label{display:block;margin:12px 0 4px}.config-panel input{width:100%}.member-line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 16px;background:#26313e;color:white;border-radius:8px;max-width:min(580px,90vw);z-index:80;box-shadow:0 5px 18px #18202b26;font-size:13px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(560px,calc(100vw - 32px));max-height:85dvh;box-shadow:0 12px 40px #18202b26}dialog::backdrop{background:#18202b66}.dialog-head,.dialog-foot{padding:14px 18px;display:flex;gap:10px;align-items:center}.dialog-head{border-bottom:1px solid var(--line)}.dialog-foot{border-top:1px solid var(--line);justify-content:flex-end}.dialog-body{padding:18px;overflow:auto;max-height:58dvh}.dialog-body label.field{display:flex;flex-direction:column;gap:5px;margin:11px 0;font-size:13px}.dialog-body textarea,.dialog-body input:not([type=checkbox]),.dialog-body select{width:100%}.dialog-body p{font-size:13px;color:var(--muted);margin:8px 0}.choice{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.choice small{margin-left:auto}.mobile-topics{display:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:1600px){.workspace{grid-template-columns:240px minmax(0,1fr) 310px}.thread{padding:22px 32px}.composer{padding-inline:24px}}

<body>
<div class="app">
 <header class="top"><span class="brand">Teams</span><span class="context muted">协作工作台</span><button class="mobile-status" style="display:none" data-view="groups">群聊</button><button class="mobile-status" style="display:none" data-view="discover">发现</button><span class="grow"></span><span class="pill green context">Relay 已连接 · 演示</span><label class="row"><small class="context">当前用户</small><select id="identity" aria-label="当前用户"><option value="me">我 · 发起者 / master</option><option value="browser">camo-browser · peer</option><option value="ship">ship-it · master</option></select></label></header>
 <div class="prototype"><strong>交互设计原型</strong><span>本页使用模拟数据，不连接 daemon 或 Vikunja。可用“演示控制”逐步查看状态。</span></div>
 <div class="shell">
  <aside class="sidebar"><nav class="nav" aria-label="主导航"><button data-view="groups">群聊</button><button data-view="discover">发现 Agent</button></nav><div class="section-label"><span>我的群聊</span><button data-command="new-group" aria-label="新建群聊">新建</button></div><div class="group-list" id="groups"></div><div class="sidebar-foot"><button data-view="settings">连接与设置</button><p style="margin-top:10px">群是共享空间。每个议题绑定一个 issue，行动结束后由发起者关闭议题。</p></div></aside>
  <main id="main" class="screen"></main>
 </div>
</div>
<dialog id="modal" aria-labelledby="dialog-title"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><span class="grow"></span><button type="button" id="dialog-x" aria-label="关闭对话框">关闭</button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-foot"><button type="button" id="dialog-cancel">取消</button><button class="primary" id="dialog-submit" type="submit">确认</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const agents=[{id:'browser',name:'camo-browser',initials:'CB',ability:'浏览器验证、页面截图',engine:'OpenCode',online:true,source:'relay-primary',capacity:'可接新行动'},{id:'ship',name:'ship-it',initials:'SI',ability:'发布核对、代码审计',engine:'DSH',online:true,source:'relay-primary',capacity:'正在处理 1 项行动'},{id:'design',name:'design-desk',initials:'DD',ability:'交互设计、设计审计',engine:'OpenCode',online:false,source:'relay-primary',capacity:'离线 · 最后更新 6 分钟前'},{id:'search',name:'rg-search',initials:'RS',ability:'资料查找、仓库检索',engine:'能力服务',online:true,source:'relay-secondary',capacity:'仅可发现，尚未接入当前群'}];
const people={me:{id:'me',name:'我',initials:'ME'},...Object.fromEntries(agents.map(a=>[a.id,a]))};
let groups=[{id:'release',name:'发布协作',members:['me','browser','ship','design'],invites:{},relay:'relay-primary',archived:false},{id:'research',name:'产品讨论',members:['me','browser','design'],invites:{},relay:'relay-primary',archived:false}];
let issues=[{id:'128',group:'release',title:'首页导航退化审计',description:'核对新版导航的可用性与发布风险。',expected:'每位审计者提交意见，发起者确认后关闭。',initiator:'me',state:'open',actions:[{id:'a1',agent:'browser',kind:'审计',reason:'发布前核对关键路径',expected:'提交导航验收结论',reply:true,state:'completed',result:'首页导航主路径通过，键盘焦点顺序需要修订。',written:true,initiator:'me',updated:'14:22'},{id:'a2',agent:'ship',kind:'审计',reason:'发布前交叉核对',expected:'提交风险与发布建议',reply:true,state:'running',initiator:'me',updated:'刚刚'}],rounds:[{id:1,author:'me',body:'请分别审计首页导航。结果补充到 issue 后，本次行动结束。',actions:['a1','a2'],time:'14:12'}],events:[],draft:{},scroll:0,unread:0,unknown:false},{id:'129',group:'release',title:'补投与断线恢复讨论',description:'收集补投边界的设计意见。',expected:'收到评论后明确处理建议。',initiator:'me',state:'open',actions:[],rounds:[],events:[],draft:{},scroll:0,unread:2,unknown:true},{id:'130',group:'research',title:'工作台信息层级讨论',description:'讨论议题列表与行动卡片。',expected:'参与者给出 comment，由发起者收口。',initiator:'me',state:'open',actions:[],rounds:[{id:1,author:'me',body:'先收集意见，再按需要发起行动。普通补充不会启动 agent。',actions:[],time:'昨天'}],events:[],draft:{},scroll:0,unread:1,unknown:false},{id:'127',group:'release',title:'旧版菜单命名核对',description:'菜单名称已统一。',expected:'完成命名核对。',initiator:'me',state:'closed',actions:[],rounds:[],events:['我已关闭议题：命名核对完成。Vikunja 关闭已确认（模拟）。'],draft:{},scroll:0,unread:0,unknown:false}];
let view='groups',groupId='release',issueId='128',identity='me',selected=new Set(),discoveryQuery='',onlyOnline=false,onlineFilter='all',modalSubmit=null,lastFocus=null,toastTimer,seq=10,closeFailure=false,readResult='open',changedAction='';
const lastIssueByGroup={release:'128',research:'130'};
const stateText={pending:'等待接管',accepted:'已接管 · 排队',running:'执行中',blocked:'需要补充信息',writing:'正在写入 issue',completed:'已完成',failed:'执行失败',unknown:'结果未确认',cancel_requested:'正在停止',cancelled:'已停止',refused:'已拒绝'};
const activeStates=['pending','accepted','running','writing','blocked','unknown','cancel_requested'];
const current=()=>issues.find(i=>i.id===issueId), group=()=>groups.find(g=>g.id===groupId), person=id=>people[id]||{name:id,initials:id.slice(0,2)};
const tone=s=>s==='completed'||s==='cancelled'?'green':['blocked','unknown','cancel_requested','pending'].includes(s)?'amber':s==='failed'||s==='refused'?'red':'blue';
const badge=(text,color='')=>`<span class="pill ${color}">${esc(text)}</span>`;
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',5000)}
function announce(text){$('#announcement').textContent=text}
function stamp(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function canCommand(to){return identity==='me'&&['browser','ship','design'].includes(to)||identity==='ship'&&to==='browser'||identity==='browser'&&['me','ship'].includes(to)}
function mayRefuse(action){return action.initiator==='browser'&&['me','ship'].includes(action.agent)}
function saveDraft(){const i=current(),t=$('#compose-text');if(!i||!t)return;i.draft={text:t.value,type:$('#compose-type').value,kind:$('#action-kind')?.value||'评论',reason:$('#reason')?.value||'',expected:$('#expected')?.value||'',reply:$('#reply')?.checked??true,targets:[...document.querySelectorAll('[name=assignee]:checked')].map(x=>x.value)};const thread=$('#thread');if(thread)i.scroll=thread.scrollTop}
function gotoIssue(id){saveDraft();const i=issues.find(x=>x.id===id);if(!i)return;issueId=i.id;groupId=i.group;lastIssueByGroup[groupId]=issueId;i.unread=0;view='groups';history.replaceState(null,'',`#group/${groupId}/issue/${issueId}`);render()}
function gotoGroup(id){saveDraft();groupId=id;const i=issues.find(x=>x.id===lastIssueByGroup[id]&&x.group===id)||issues.find(x=>x.group===id&&x.state!=='closed')||issues.find(x=>x.group===id);issueId=i?.id||'';if(i)lastIssueByGroup[id]=i.id;view='groups';history.replaceState(null,'',i?`#group/${id}/issue/${i.id}`:`#group/${id}`);render()}
function groupItems(){return groups.map(g=>{const own=issues.filter(i=>i.group===g.id),count=own.reduce((n,i)=>n+i.unread,0),running=own.reduce((n,i)=>n+i.actions.filter(a=>['running','writing'].includes(a.state)).length,0);return `<button class="group-button ${groupId===g.id&&view==='groups'?'active':''}" data-group="${g.id}" aria-current="${groupId===g.id&&view==='groups'?'true':'false'}"><span class="avatar">${esc(g.name.slice(0,1))}</span><span class="grow"><strong>${esc(g.name)}${g.archived?' · 已归档':''}</strong><small>${own.filter(i=>i.state!=='closed').length} 个打开议题${running?' · '+running+' 项执行中':''}</small></span>${count?badge(count+' 新'):''}</button>`}).join('')}
function summary(i){const last=i.rounds.findLast(r=>r.actions.length),as=last?i.actions.filter(a=>last.actions.includes(a.id)):[],remaining=i.actions.filter(a=>activeStates.includes(a.state)),older=remaining.filter(a=>!last?.actions.includes(a.id));if(i.state==='closed')return remaining.length?`议题已关闭 · ${remaining.length} 项行动尚未确认结束，请查看行动状态。`:'议题已关闭 · 历史可查。';if(!as.length)return '尚无待处理行动。';const counts={};as.forEach(a=>counts[stateText[a.state]]=(counts[stateText[a.state]]||0)+1);return `本轮 ${new Set(as.map(a=>a.agent)).size} 位参与：${Object.entries(counts).map(([k,v])=>v+' 项'+k).join(' · ')}${older.length?'；此前还有 '+older.length+' 项未结束':''}${!remaining.length?'。行动已结束，可查看结果、追问或关闭议题。':''}`}
function topicItems(){const own=issues.filter(i=>i.group===groupId);return own.length?own.map(i=>`<button class="topic-button ${i.id===issueId?'active':''}" data-issue="${i.id}" aria-current="${i.id===issueId?'true':'false'}">${badge(i.state==='closed'?'已关闭':i.state==='closing'?'关闭中':'打开',i.state==='closed'?'':'blue')}<strong>${esc(i.title)}</strong><small>#${i.id} · ${esc(person(i.initiator).name)}发起${i.unread?' · '+i.unread+' 条新消息':''}</small><small>${i.actions.filter(a=>activeStates.includes(a.state)).length} 项未结束行动</small></button>`).join(''):'<p class="empty">群已建立。新建议题，开始协作。</p>'}
function renderEntryRound(i,r){const as=i.actions.filter(a=>r.actions.includes(a.id));return `<section class="round"><div class="round-title"><b>${as.length?'第 '+r.id+' 轮行动':'群内补充'}</b><span>${esc(person(r.author).name)} · ${esc(r.time)}</span>${as.length?badge(as.length+' 人承担行动','blue'):''}</div><div class="entry mine"><p>${esc(r.body)}</p><small>${as.length?as.map(a=>'@'+person(a.agent).name+' · '+a.kind).join('；'):'仅补充到共享历史，不产生新行动'}</small></div>${as.map(a=>`<div class="entry"><div class="row"><span class="avatar">${esc(person(a.agent).initials)}</span><b>${esc(person(a.agent).name)}</b><span class="grow"></span>${badge(stateText[a.state],tone(a.state))}</div><p>${esc(a.kind)}：${esc(a.expected)}</p><small>原因：${esc(a.reason)} · ${a.reply?'需要面向发起者答复':'无需单独答复，仍需完成行动并留痕'}</small>${a.result?`<div class="result">${esc(a.result)}<br><small>${a.written?'结果已写入 issue（模拟）':'结果留痕：尚未确认写入 issue'}</small></div>`:''}<div class="row wrap" style="margin-top:9px">${a.state==='blocked'?`<button data-provide="${a.id}">补充信息</button>`:''}${a.state==='completed'?`<button data-follow="${a.id}" ${i.state!=='open'?'disabled':''}>追问</button>`:''}${mayRefuse(a)&&a.state==='pending'&&identity===a.agent?`<button data-refuse="${a.id}">说明原因并拒绝</button>`:''}<button data-action-detail="${a.id}">行动详情</button></div></div>`).join('')}</section>`}
function card(i,id){const own=i.actions.filter(a=>a.agent===id),pending=own.filter(a=>activeStates.includes(a.state)),a=pending.find(a=>['unknown','blocked','cancel_requested'].includes(a.state))||pending[0]||own.at(-1),p=person(id),online=id==='me'||agents.find(x=>x.id===id)?.online;return `<article class="agent-card ${a&&['running','writing','cancel_requested'].includes(a.state)?'running':''} ${a?.id===changedAction?'changed':''}"><div class="row"><span class="avatar ${id==='me'?'human':''}">${esc(p.initials)}</span><b class="grow">${esc(p.name)}</b></div><div class="row wrap" style="margin-top:8px">${badge(a?stateText[a.state]:'旁观',a?tone(a.state):'')}${pending.length>1?badge(pending.length+' 项未结束','amber'):''}${badge(online?'在线':'离线',online?'':'amber')}</div><p>${a?esc(a.state==='running'?'正在处理：'+a.expected:a.state==='blocked'?'缺少复现记录，请补充信息。':a.state==='writing'?'正在写入结果，尚未确认完成。':a.state==='cancel_requested'?'停止请求已发出，尚未确认停止。':a.state==='unknown'?'结果未确认，请先回读。':a.state==='completed'?'结果已写入 issue。':a.expected):'没有待处理行动。'}</p>${a?`<small>最近进展 ${esc(a.updated||'刚刚')} · ${esc(a.kind)}</small>`:''}${a&&['running','writing','cancel_requested'].includes(a.state)?'<div class="stage-line" aria-hidden="true"><i></i></div>':''}<details><summary>${own.length>1?'全部行动与详情':'执行详情'}</summary>${own.map(item=>`<p>${esc(item.kind)} · ${esc(stateText[item.state])}<br>${esc(item.expected)}<br><small>action ${esc(item.id)}</small></p>`).join('')}<p>议题 #${i.id}<br>本地 ACP Session：${a?'映射待第二批定案（示意）':'无行动，不创建'}<br>${pending.some(a=>a.state==='cancel_requested')?'仍有行动未确认停止':''}</p></details></article>`}
function composer(i){const d=i.draft||{},locked=i.state!=='open'||i.unknown||group().archived;return `<form class="composer" id="composer"><div class="composer-options"><label>发送方式 <select id="compose-type" ${locked?'disabled':''}><option value="note" ${d.type==='note'?'selected':''}>补充消息</option><option value="action" ${d.type==='action'?'selected':''}>请人处理</option><option value="followup" ${d.type==='followup'?'selected':''}>追问</option></select></label><label class="action-fields ${!['action','followup'].includes(d.type)?'hidden':''}">行动 <select id="action-kind"><option>评论</option><option>审计</option><option>执行</option><option>提供信息</option></select></label><label class="action-fields ${!['action','followup'].includes(d.type)?'hidden':''}"><input id="reply" type="checkbox" ${d.reply===false?'':'checked'}> 需要答复</label></div><div class="action-fields ${!['action','followup'].includes(d.type)?'hidden':''}"><div class="assignees" aria-label="行动对象">${group().members.filter(id=>id!==identity).map(id=>`<label><input name="assignee" type="checkbox" value="${id}" ${(d.targets||[]).includes(id)?'checked':''} ${canCommand(id)?'':'disabled'}>${esc(person(id).name)}</label>`).join('')}</div><div class="extra"><label>为什么需要处理<input id="reason" value="${esc(d.reason||'')}" placeholder="例如：发布前需要独立审计"></label><label>什么结果算完成<input id="expected" value="${esc(d.expected||'')}" placeholder="例如：将风险与结论补充到 issue"></label></div></div><textarea id="compose-text" aria-label="消息或行动要求" placeholder="${locked?'议题不可发起新行动；可查看历史或由发起者重开。':'补充信息，或选择“请人处理”发起明确行动。@ 文本不会自行创建行动。'}" ${locked?'disabled':''}>${esc(d.text||'')}</textarea><div class="sendbar"><small>${locked?'先确认 issue 状态，再继续。':'群内可见 · 只有明确行动对象才执行 · Ctrl / ⌘ + Enter 发送'}</small><button class="primary" type="submit" ${locked?'disabled':''}>发送</button></div></form>`}
function renderWorkspace(){const g=group(),i=current();return `<header class="workspace-head"><div class="row wrap"><h1>${esc(g.name)}</h1>${badge(g.members.length+' 位成员')}${g.archived?badge('已归档','amber'):''}<span class="grow"></span><button data-command="new-group" class="desktop-extra">新建群</button><button data-command="members">成员与邀请</button><button data-command="group-menu">群管理</button></div><p>${esc(g.relay)} · 群共享消息，每个议题单独跟踪</p><div class="mobile-topics"><select id="mobile-group" aria-label="切换群聊">${groups.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="mobile-issue" aria-label="切换议题">${issues.filter(x=>x.group===g.id).map(x=>`<option value="${x.id}" ${x.id===issueId?'selected':''}>#${x.id} ${esc(x.title)}</option>`).join('')}</select><button data-command="new-issue">新议题</button></div></header><div class="workspace"><aside class="topics"><div class="topic-tools"><b class="grow">议题会话</b><button data-command="new-issue" ${g.archived?'disabled':''}>新建议题</button></div><div class="topic-list">${topicItems()}</div></aside>${i?`<section class="conversation" aria-label="当前议题"><header class="issue-head"><div class="row wrap"><h2 class="grow">${esc(i.title)}</h2>${badge(i.state==='closed'?'已关闭':i.state==='closing'?'关闭中':'打开',i.state==='open'?'blue':'')}<button data-command="lifecycle" ${i.state==='closing'?'disabled':''}>${identity!==i.initiator?'建议关闭':i.state==='closed'?'重开议题':'关闭议题'}</button></div><div class="issue-meta"><button data-command="issue-record">issue #${i.id} · 模拟记录</button> ${esc(person(i.initiator).name)}发起 · ${esc(i.description)}</div><div class="row wrap"><small class="grow">结束条件：${esc(i.expected)}</small><button class="mobile-status" style="display:none" data-command="status-detail">查看行动状态</button></div></header><div class="summary" id="overall"><strong>${esc(summary(i))}</strong>${i.actions.some(a=>['cancel_requested','unknown'].includes(a.state))?'<p style="color:var(--amber)">仍有行动未确认结果或物理停止，请查看行动卡片。</p>':''}</div>${i.unknown?'<div class="notice row"><span class="grow">issue 外部状态未确认，新行动暂不准入。</span><button data-command="readback">回读状态</button></div>':''}<div class="thread" id="thread" tabindex="0" aria-label="议题消息和行动历史">${i.rounds.length?i.rounds.map(r=>renderEntryRound(i,r)).join(''):'<div class="empty"><h3>从一个明确的问题开始</h3><p>补充消息，或请指定 agent 评论、审计和执行。</p></div>'}${i.events.map(e=>`<div class="event">${esc(e)}</div>`).join('')}</div>${composer(i)}</section><aside class="inspector"><h3>本议题 · Agent 状态</h3><p class="muted" style="font-size:12px;margin-bottom:12px">行动状态与在线状态分别显示。完成后不会自动回复或继续。</p>${g.members.map(id=>card(i,id)).join('')}${demoTools(i)}</aside>`:'<section class="conversation"><div class="empty"><h2>群已建立</h2><p>邀请成员后，新建议题开始讨论。</p><button class="primary" data-command="new-issue">新建议题</button></div></section>'}</div>`}
function demoTools(i){return `<details class="demo-tools"><summary>演示控制（非产品功能）</summary><p>手动推进模拟事件；刷新重置。</p><div class="row wrap"><button data-command="advance">下一阶段</button><button data-command="block">模拟阻塞</button><button data-command="result-unknown">模拟写回未知</button><button data-command="resolve-result">回读行动结果</button></div><button data-command="external-close">模拟外部关闭</button><button data-command="stop-confirm">模拟停止确认</button><label style="display:block;margin-top:8px;font-size:12px"><input type="checkbox" id="close-failure" ${closeFailure?'checked':''}> 模拟关闭写入失败</label></details>`}
function discovery(){const list=agents.filter(a=>(!discoveryQuery||[a.name,a.ability,a.source].join(' ').toLowerCase().includes(discoveryQuery.toLowerCase()))&&(!onlyOnline||a.online)&&(onlineFilter==='all'||a.engine===onlineFilter));return `<div class="page"><div class="page-head row"><div class="grow"><h1>发现 Agent</h1><p>先看它能做什么、是否可用，再邀请到群。不同 Relay 的群成员暂不互通。</p></div><button class="primary" data-command="new-group">新建群聊</button><button data-view="settings">连接设置</button></div><div class="filters"><input id="agent-search" type="search" aria-label="搜索 Agent" placeholder="搜索名称、能力或服务器" value="${esc(discoveryQuery)}"><select id="engine-filter" aria-label="按引擎筛选">${['all','OpenCode','DSH','能力服务'].map(x=>`<option value="${x}" ${onlineFilter===x?'selected':''}>${x==='all'?'全部能力来源':x}</option>`).join('')}</select><label><input type="checkbox" id="online-only" ${onlyOnline?'checked':''}> 只看在线</label></div><div class="selection-bar"><strong>已选 ${selected.size} 位</strong><small class="grow">当前群连接 ${esc(group().relay)}</small><button data-command="invite-selected" ${!selected.size?'disabled':''}>邀请到群</button></div><div class="agent-table">${list.length?list.map(a=>`<div class="discovery-row"><input type="checkbox" data-select-agent="${a.id}" aria-label="选择 ${a.name}" ${selected.has(a.id)?'checked':''}><div><strong>${esc(a.name)}</strong><small>${esc(a.capacity)}</small></div><div class="ability">${esc(a.ability)}<small>${esc(a.engine)}</small></div><small class="source">${esc(a.source)}</small><button data-agent="${a.id}">查看能力</button></div>`).join(''):'<p class="empty">没有符合条件的 Agent。请调整搜索或在线筛选。</p>'}</div><p class="muted" style="font-size:12px;margin-top:12px">目录是模拟数据。在线只表示连接状态，不代表行动已接管或执行成功。</p></div>`}
function settings(){return `<div class="page"><div class="page-head"><h1>连接与设置</h1><p>当前为设计演示。配置不会写入真实 daemon。</p></div><form class="config-panel" id="settings-form"><h2>Relay 连接</h2><label for="relay-name">显示名称</label><input id="relay-name" value="relay-primary" required><label for="relay-url">WSS 地址</label><input id="relay-url" value="wss://relay-a.example:8443" required><label for="credential-ref">凭据引用</label><input id="credential-ref" value="env:TEAMS_TOKEN" required><p class="muted" style="font-size:12px;margin:12px 0">使用 TLS 校验证书。只保存引用，不在消息中保存凭据。示例地址不发起网络连接。</p><button class="primary">模拟保存</button></form></div>`}
function render(){const main=$('#main'),demoOpen=$('.demo-tools')?.open;$('#groups').innerHTML=groupItems();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));main.innerHTML=view==='discover'?discovery():view==='settings'?settings():renderWorkspace();if(demoOpen&&$('.demo-tools'))$('.demo-tools').open=true;bindLocal();if($('#action-kind')&&current()?.draft.kind)$('#action-kind').value=current().draft.kind;const t=$('#thread');if(t)t.scrollTop=current()?.scroll||0;changedAction=''}
function updateAction(a,state,result){a.state=state;a.updated=stamp();if(result)a.result=result;changedAction=a.id;announce(person(a.agent).name+'：'+stateText[state]);saveDraft();render()}
function openDialog(title,body,submit,callback){saveDraft();lastFocus=document.activeElement;modalSubmit=callback;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-submit').textContent=submit;$('#modal').showModal();setTimeout(()=>$('#dialog-body').querySelector('input,textarea,select,button')?.focus(),0)}
function closeDialog(){if($('#modal').open)$('#modal').close();if(lastFocus?.isConnected)lastFocus.focus();modalSubmit=null}
function command(name){const i=current(),g=group();if(name==='new-group'){openDialog('新建群聊','<label class="field">群聊名称<input name="name" required placeholder="例如：发布协作"></label><p>创建共享空间，再由受邀者决定是否加入。不会因建群自动启动模型。</p>'+agents.filter(a=>a.source==='relay-primary').map(a=>`<label class="choice"><input type="checkbox" name="member" value="${a.id}">${esc(a.name)}<small>${a.online?'在线':'离线 · 邀请可保留'}</small></label>`).join(''),'创建并邀请',f=>{const id='group'+(++seq),members=[...new FormData(f).getAll('member')];groups.push({id,name:new FormData(f).get('name'),members:['me'],invites:Object.fromEntries(members.map(x=>[x,'pending'])),relay:'relay-primary',archived:false});closeDialog();gotoGroup(id);toast('群已创建（模拟）。可在“成员与邀请”中查看接受进度。')});return}
if(name==='new-issue'){openDialog('发起议题','<label class="field">议题是什么<input name="title" required placeholder="用一句话说明问题"></label><label class="field">为什么讨论<textarea name="description" required></textarea></label><label class="field">什么结果可以关闭<input name="expected" required placeholder="例如：收齐审计意见并处理阻断项"></label><p>模拟创建 Vikunja issue；你是发起者，负责追问和关闭。</p>','创建议题',f=>{const d=new FormData(f),id=String(140+(++seq));issues.push({id,group:g.id,title:d.get('title'),description:d.get('description'),expected:d.get('expected'),initiator:identity,state:'open',actions:[],rounds:[],events:['模拟 Vikunja issue 创建并读回确认。'],draft:{},scroll:0,unread:0,unknown:false});closeDialog();gotoIssue(id);toast('议题已创建（模拟），可以请人处理或补充信息。')});return}
if(name==='members'){const invited=Object.entries(g.invites);openDialog('成员与邀请',g.members.map(id=>`<div class="member-line"><b>${esc(person(id).name)}</b><span>${id==='me'?'群管理员 · master':id==='ship'?'master':'peer'} · 已加入</span></div>`).join('')+invited.map(([id,s])=>`<div class="member-line"><b>${esc(person(id).name)}</b><span>${s==='pending'?'等待接受':s==='declined'?'已拒绝':'已接受'}</span>${s==='pending'?`<button type="button" data-invite-accept="${id}">模拟接受</button><button type="button" data-invite-decline="${id}">模拟拒绝</button>`:''}</div>`).join('')+'<p>群管理权与行动指挥权分开。演示中我可以指派现有成员；camo-browser 可以向其 master 请求，master 可拒绝。peer 不能拒绝有效向下指派。</p>','去发现并邀请',()=>{closeDialog();view='discover';render()});return}
if(name==='invite-selected'){if(identity!=='me'){toast('只有群管理员可以邀请成员。');return}const items=[...selected];openDialog('邀请到当前群',`<p>目标：${esc(g.name)}</p>`+items.map(id=>`<div class="member-line">${esc(person(id).name)}${badge(agents.find(a=>a.id===id).source===g.relay?'同一 Relay':'跨 Relay 暂不支持','amber')}</div>`).join('')+'<p>只邀请当前 Relay 的成员。跨 Relay 项保留选择，不会伪报成功。</p>','发送同 Relay 邀请',()=>{let n=0;items.forEach(id=>{if(agents.find(a=>a.id===id).source===g.relay&&!g.members.includes(id)){g.invites[id]='pending';n++;selected.delete(id)}});closeDialog();render();toast(n?'已发送 '+n+' 份邀请（模拟）。接受后才加入群。':'没有可新增的同 Relay 成员；跨 Relay 尚不支持。')});return}
if(name==='group-menu'){openDialog('群管理',`<label class="field">群名<input name="name" value="${esc(g.name)}" required></label><p>关闭议题在议题头部操作；归档群只隐藏活跃入口，不会关闭 issue 或终止行动。</p><label class="choice"><input name="archive" type="checkbox" ${g.archived?'checked':''}>归档此群</label><p>离开群会撤销访问并请求取消本人行动。此原型不执行真实离群；正式接入前须验证权限与取消回执。</p>`,'保存群设置',f=>{const d=new FormData(f);g.name=d.get('name');g.archived=d.has('archive');closeDialog();render();toast('群设置已保存到本页（模拟），issue 状态未改变。')});return}
if(name==='lifecycle'){if(identity!==i.initiator){openDialog('建议发起者关闭','<label class="field">建议原因<textarea name="reason" required></textarea></label><p>只提交建议，不改变 issue 状态，也不自动触发新行动。</p>','发送建议',f=>{i.events.push(person(identity).name+'建议关闭：'+new FormData(f).get('reason'));closeDialog();render()});return}const reopening=i.state==='closed',as=i.actions.filter(a=>activeStates.includes(a.state));openDialog(reopening?'重开原议题':'关闭议题与 issue',`<p>将${reopening?'重开':'关闭'}原 issue #${i.id}，不会创建替代 issue。${reopening?'旧行动不自动重跑。':'未开始行动取消，在飞行动请求停止。'}</p>${!reopening&&as.length?'<p>尚未结束：'+as.map(a=>esc(person(a.agent).name)+' · '+stateText[a.state]).join('；')+'</p>':''}<label class="field">${reopening?'为什么需要重开':'关闭结论与依据'}<textarea name="reason" required></textarea></label><p>只有模拟写入并读回确认后才显示${reopening?'打开':'已关闭'}。物理停止状态单独报告。</p>`,reopening?'确认重开原 issue':'确认关闭 issue',f=>{const reason=new FormData(f).get('reason');if(closeFailure&&!reopening){i.unknown=true;i.events.push('关闭写入结果未确认：'+reason+'。不能显示为已关闭。');closeDialog();render();toast('模拟写入失败：关闭未确认，请回读状态。');return}if(reopening){i.state='open';i.unknown=false;i.events.push('我重开原 issue #'+i.id+'：'+reason+'。旧行动不重跑。')}else closeIssue(i,reason,false);closeDialog();render();announce(reopening?'原 issue 已重开，旧行动不重跑。':'issue 已关闭；请检查尚未确认停止的行动。')});return}
if(name==='issue-record'){openDialog('Vikunja issue #'+i.id+' · 模拟记录',`<p>${esc(i.title)}</p><p>原型没有真实 Vikunja 地址，不提供虚假外链。</p><p>发起者：${esc(person(i.initiator).name)} · 状态：${esc(i.state)}</p><h3>已写入评论</h3>`+i.actions.filter(a=>a.written).map(a=>`<div class="entry"><b>${esc(person(a.agent).name)}</b><p>${esc(a.result)}</p><small>action ${a.id} · 模拟 resultRef</small></div>`).join(''),'返回议题',()=>closeDialog());return}
if(name==='status-detail'){openDialog('行动状态',g.members.map(id=>card(i,id)).join('')+demoTools(i),'返回',()=>closeDialog());return}
if(name==='advance'){const a=i.actions.find(a=>['pending','accepted','running','writing'].includes(a.state));if(!a){toast('没有可推进的行动。请选择“请人处理”创建新行动。');return}const next={pending:'accepted',accepted:'running',running:'writing',writing:'completed'}[a.state];if(next==='completed'){a.result=a.result||'已完成'+a.kind+'，结论与依据已补充到原 issue。';a.written=true}updateAction(a,next);return}
if(name==='block'||name==='result-unknown'){const a=i.actions.find(a=>['pending','accepted','running','writing'].includes(a.state));if(!a){toast('没有正在处理的行动。');return}updateAction(a,name==='block'?'blocked':'unknown');return}
if(name==='resolve-result'){const a=i.actions.find(a=>a.state==='unknown');if(!a){toast('没有结果未知的行动。');return}openDialog('回读行动结果','<p>按稳定提交标识查找原 issue 的结果，不重新执行行动。</p><label class="field">模拟回读结果<select name="outcome"><option value="found">找到原结果评论</option><option value="unknown">无法确定，保留未知</option></select></label>','确认模拟回读',f=>{if(new FormData(f).get('outcome')==='found'){a.result='回读找到原结果评论，未重复执行或追加。';a.written=true;closeDialog();updateAction(a,'completed')}else{closeDialog();toast('仍无法确认结果，保持 unknown，不自动重试。')}});return}
if(name==='external-close'){closeIssue(i,'模拟发起者在 Vikunja 直接关闭',true);saveDraft();render();toast('已模拟轮询读到外部关闭，并执行相同的取消与收口。');return}
if(name==='stop-confirm'){const a=i.actions.find(a=>a.state==='cancel_requested');if(a){updateAction(a,'cancelled');toast('模拟收到物理停止确认。')}else toast('没有等待停止确认的行动。');return}
if(name==='readback'){openDialog('回读外部状态','<p>演示读取过程；真实产品从 Vikunja 回读，不通过隐藏提示消除未知。</p><label class="field">模拟返回<select id="read-result"><option value="open">确认打开</option><option value="closed">确认已关闭</option><option value="unknown">仍然未知 / 读取失败</option></select></label>','开始回读',()=>{readResult=$('#read-result').value;$('#dialog-submit').disabled=true;$('#dialog-submit').textContent='正在读取…';setTimeout(()=>{if(readResult==='closed')closeIssue(i,'回读确认外部关闭',true);else if(readResult==='open'){i.unknown=false;i.state='open';i.events.push('回读确认 issue 仍打开（模拟）。')}else{i.unknown=true;i.events.push('回读仍无法确认状态；继续阻止新行动。')}$('#dialog-submit').disabled=false;closeDialog();render();toast(readResult==='unknown'?'仍未确认，保留警告与恢复入口。':'外部状态已回读确认（模拟）。')},650)});return}
}
function closeIssue(i,reason,external){i.actions.forEach(a=>{if(['pending','accepted'].includes(a.state))a.state='cancelled';else if(activeStates.includes(a.state)&&a.state!=='cancel_requested')a.state='cancel_requested';a.updated=stamp()});i.state='closed';i.unknown=false;const count=i.actions.filter(a=>a.state==='cancel_requested').length;i.events.push((external?'外部关闭已收敛':'发起者关闭并读回确认')+'（模拟）：'+reason+'。'+(count?count+' 项行动仍未确认物理停止。':'没有在飞行动。'))}
function submitMessage(e){e.preventDefault();const i=current();if(i.state!=='open'||i.unknown||group().archived)return;saveDraft();const d=i.draft,txt=d.text.trim();if(!txt){toast('请填写消息或行动要求。');return}const isAction=['action','followup'].includes(d.type),targets=d.targets||[];if(isAction&&(!targets.length||!d.reason.trim()||!d.expected.trim())){toast('请选择行动对象，并填写原因与完成条件。输入已保留。');return}if(isAction&&targets.some(id=>!canCommand(id))){toast('没有有效指挥或请求关系，不能创建该行动。');return}const ids=[];if(isAction)targets.forEach(id=>{const aid='a'+(++seq);i.actions.push({id:aid,agent:id,kind:d.type==='followup'?'追问':$('#action-kind').value,reason:d.reason,expected:d.expected,reply:d.reply,state:'pending',initiator:identity,updated:stamp(),parent:i.followupId||null});ids.push(aid)});i.rounds.push({id:i.rounds.filter(r=>r.actions.length).length+1,author:identity,body:txt,actions:ids,time:stamp()});i.draft={};i.followupId=null;i.scroll=Number.MAX_SAFE_INTEGER;render();announce(isAction?'行动已提交（模拟），等待指定成员接管。':'补充已加入群内历史，不触发行动。')}
function bindLocal(){const form=$('#composer');if(form){form.addEventListener('submit',submitMessage);$('#compose-type').addEventListener('change',()=>{saveDraft();document.querySelectorAll('.action-fields').forEach(e=>e.classList.toggle('hidden',!['action','followup'].includes($('#compose-type').value)))});$('#compose-text').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();form.requestSubmit()}})}$('#mobile-group')?.addEventListener('change',e=>gotoGroup(e.target.value));$('#mobile-issue')?.addEventListener('change',e=>gotoIssue(e.target.value));$('#agent-search')?.addEventListener('input',e=>{discoveryQuery=e.target.value;const pos=e.target.selectionStart;render();$('#agent-search').focus();$('#agent-search').setSelectionRange(pos,pos)});$('#online-only')?.addEventListener('change',e=>{onlyOnline=e.target.checked;render()});$('#engine-filter')?.addEventListener('change',e=>{onlineFilter=e.target.value;render()});$('#close-failure')?.addEventListener('change',e=>closeFailure=e.target.checked);$('#settings-form')?.addEventListener('submit',e=>{e.preventDefault();toast('配置已在演示中提交；没有连接真实服务器或执行 TLS 校验。')})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){saveDraft();view=b.dataset.view;render();return}if(b.dataset.group){gotoGroup(b.dataset.group);return}if(b.dataset.issue){gotoIssue(b.dataset.issue);return}if(b.dataset.command){command(b.dataset.command);return}if(b.dataset.agent){const a=agents.find(a=>a.id===b.dataset.agent);openDialog(a.name,`<p>${esc(a.ability)}</p><p>${esc(a.engine)} · ${esc(a.capacity)}</p><p>目录来源：${esc(a.source)} · 示例更新：刚刚</p><p>能力服务是否支持某类行动，需在真实协商后确认；不能从在线状态推断。</p>`,'选择该 Agent',()=>{selected.add(a.id);closeDialog();render()});return}if(b.dataset.inviteAccept||b.dataset.inviteDecline){const id=b.dataset.inviteAccept||b.dataset.inviteDecline;if(b.dataset.inviteAccept){group().invites[id]='accepted';if(!group().members.includes(id))group().members.push(id)}else group().invites[id]='declined';closeDialog();render();command('members');return}if(b.dataset.follow){const a=current().actions.find(a=>a.id===b.dataset.follow);saveDraft();current().draft={type:'followup',targets:[a.agent],text:'',reason:'',expected:'',reply:true};current().followupId=a.id;render();$('#compose-text').focus();return}if(b.dataset.actionDetail){const a=current().actions.find(a=>a.id===b.dataset.actionDetail);openDialog('行动详情',`<p>发起者：${esc(person(a.initiator).name)} → 处理者：${esc(person(a.agent).name)}</p><p>要求：${esc(a.expected)}</p><p>原因：${esc(a.reason)}</p><p>状态：${esc(stateText[a.state])}</p><p>关联原议题 #${current().id}${a.parent?' · 追问 '+esc(a.parent):''}</p><p>已接管不代表完成。只有结果按行动契约留痕后结束。</p>`,'返回',()=>closeDialog());return}if(b.dataset.provide){const a=current().actions.find(a=>a.id===b.dataset.provide);openDialog('补充所缺信息','<label class="field">复现记录或资料<textarea name="info" required></textarea></label><p>关联原 action 恢复处理，不创建自动互答链。</p>','提供并恢复行动',f=>{current().events.push(person(identity).name+'补充资料：'+new FormData(f).get('info'));closeDialog();updateAction(a,'running')});return}if(b.dataset.refuse){const a=current().actions.find(a=>a.id===b.dataset.refuse);openDialog('拒绝这次请求','<label class="field">具体原因<textarea name="reason" required></textarea></label><p>仅 master 可以拒绝 peer 的向上请求。拒绝 action 不关闭 issue。</p>','提交拒绝原因',f=>{a.result='拒绝原因：'+new FormData(f).get('reason');closeDialog();updateAction(a,'refused')});return}});
document.addEventListener('change',e=>{if(e.target.matches('[data-select-agent]')){const id=e.target.dataset.selectAgent;e.target.checked?selected.add(id):selected.delete(id);render()}if(e.target.id==='close-failure')closeFailure=e.target.checked});
$('#identity').addEventListener('change',e=>{saveDraft();identity=e.target.value;render()});$('#dialog-form').addEventListener('submit',e=>{e.preventDefault();if(modalSubmit)modalSubmit(e.target)});$('#dialog-x').addEventListener('click',closeDialog);$('#dialog-cancel').addEventListener('click',closeDialog);$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
document.addEventListener('click',e=>{if($('#modal').open&&e.target.closest('#modal [data-command]'))closeDialog()},true);
const route=location.hash.match(/^#group\/([^/]+)(?:\/issue\/([^/]+))?$/);if(route&&groups.some(g=>g.id===route[1])){groupId=route[1];issueId=issues.find(i=>i.id===route[2]&&i.group===groupId)?.id||issues.find(i=>i.group===groupId)?.id||'';lastIssueByGroup[groupId]=issueId}if(location.hash==='#discover')view='discover';render();
</script>
</body>
