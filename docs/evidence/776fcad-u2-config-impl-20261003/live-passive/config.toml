# AgentTeams user config. This is the only file you normally edit.
# internal.toml, TLS and child projections are generated by the runtime.
version = 3

[bridge]
enabled = true

[agents.provider]
enabled = true
role = "provider"
label = "Local provider"

[agents.provider.identity]
hostId = "local"
machineId = "local"
accountId = "local"
agentKind = "custom"
label = "Local provider"

[agents.provider.runtime]
scopeId = "local"
dataDirectory = "data/provider"
policy = { revision = 1, allowedConsumers = ["receiver"], allowedManagers = [] }
cli = { camoExecutable = "/missing/camo", searchExecutable = "/opt/homebrew/bin/rg", searchRoot = "files", profilePrefix = "teams-provider" }

[agents.receiver]
enabled = true
role = "provider"
label = "Local receiver"

[agents.receiver.identity]
hostId = "local"
machineId = "local"
accountId = "local"
agentKind = "custom"
label = "Local receiver"

[agents.receiver.runtime]
scopeId = "local"
dataDirectory = "data/receiver"
policy = { revision = 1, allowedConsumers = [], allowedManagers = [] }
cli = { camoExecutable = "/missing/camo", searchExecutable = "/opt/homebrew/bin/rg", searchRoot = "files", profilePrefix = "teams-receiver" }

[console]
enabled = false
