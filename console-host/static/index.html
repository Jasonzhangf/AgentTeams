<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Teams Console</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; }
      main { width: min(1180px, calc(100% - 32px)); margin: 32px auto; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; border: 1px solid #334155; border-radius: 14px 14px 0 0; background: #111c31; }
      nav { display: flex; gap: 8px; padding: 12px; border: 1px solid #334155; border-top: 0; background: #101b2f; }
      button { border: 1px solid #475569; border-radius: 8px; padding: 9px 12px; color: inherit; background: #17233a; cursor: pointer; }
      button[aria-current="page"] { border-color: #60a5fa; background: #1e3a5f; }
      section { padding: 22px; border: 1px solid #334155; border-top: 0; background: #0f172a; }
      #sessions { display: grid; gap: 10px; }
      #drawer { position: fixed; inset: auto 0 0; max-height: 72vh; padding: 18px; border: 1px solid #475569; border-radius: 16px 16px 0 0; background: #111c31; box-shadow: 0 -12px 32px #0008; }
      #drawer header { padding: 0 0 14px; border: 0; background: transparent; }
      .status { color: #34d399; }
      @media (max-width: 800px) { main { width: 100%; margin: 0; } header { border-radius: 0; } nav { overflow-x: auto; } section { min-height: calc(100vh - 142px); } }
    </style>
  </head>
  <body>
    <main>
      <header><strong>Teams Console</strong><span class="status" id="status">Connecting</span></header>
      <nav aria-label="Teams entries">
        <button aria-current="page" data-entry="topology">Topology</button>
        <button data-entry="conversations">Conversations</button>
        <button data-entry="notifications">Notifications</button>
        <button data-entry="search">Search</button>
        <button data-entry="memory">Memory</button>
      </nav>
      <section><h1 id="title">Topology</h1><p id="summary">Loading OpenCode sessions...</p><div id="sessions"></div></section>
      <aside id="drawer" hidden aria-label="Details"><header><strong id="drawer-title">Details</strong><button id="drawer-close" type="button">Close</button></header><div id="drawer-body"></div></aside>
    </main>
    <script>
      const title = document.querySelector('#title')
      const summary = document.querySelector('#summary')
      const sessions = document.querySelector('#sessions')
      let currentProjection = { sessions: [], agents: [], notifications: [] }
      const drawer = document.querySelector('#drawer')
      const drawerTitle = document.querySelector('#drawer-title')
      const drawerBody = document.querySelector('#drawer-body')
      const closeDrawer = () => { drawer.hidden = true }
      document.querySelector('#drawer-close').addEventListener('click', closeDrawer)
      async function postAction(action) {
        const response = await fetch('/api/action', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(action) })
        if (!response.ok) throw new Error(await response.text())
      }
      function showDrawer(titleText, bodyText, actions = []) {
        drawerTitle.textContent = titleText
        drawerBody.replaceChildren(Object.assign(document.createElement('p'), { textContent: bodyText }))
        for (const action of actions) {
          const button = document.createElement('button')
          button.type = 'button'
          button.textContent = action.label
          button.addEventListener('click', async () => {
            button.disabled = true
            try { await postAction(action.payload); button.textContent = 'Done' } catch (error) { button.disabled = false; button.textContent = String(error) }
          })
          drawerBody.append(button)
        }
        drawer.hidden = false
      }
      function renderSessions() {
        sessions.replaceChildren(...currentProjection.sessions.map(session => {
          const item = document.createElement('button')
          item.type = 'button'
          item.textContent = session.title || session.id
          item.addEventListener('click', () => showDrawer(session.title || session.id, `OpenCode session ${session.id}`))
          return item
        }))
      }
      document.querySelectorAll('[data-entry]').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('[data-entry]').forEach(item => item.removeAttribute('aria-current'))
        button.setAttribute('aria-current', 'page')
        title.textContent = button.textContent
        if (button.dataset.entry === 'notifications') {
          sessions.replaceChildren(...currentProjection.notifications.map(notification => {
            const item = document.createElement('button')
            item.type = 'button'
            item.textContent = `Approval: ${notification.sessionId}`
            item.addEventListener('click', () => showDrawer('Approval', `Permission ${notification.requestId}`, [
              { label: 'Allow once', payload: { kind: 'reply-permission', sessionId: notification.sessionId, permissionId: notification.requestId, response: 'once' } },
              { label: 'Always allow', payload: { kind: 'reply-permission', sessionId: notification.sessionId, permissionId: notification.requestId, response: 'always' } },
              { label: 'Reject', payload: { kind: 'reply-permission', sessionId: notification.sessionId, permissionId: notification.requestId, response: 'reject' } },
            ]))
            return item
          }))
        } else if (button.dataset.entry === 'topology' || button.dataset.entry === 'conversations') {
          renderSessions()
        } else {
          sessions.replaceChildren(Object.assign(document.createElement('p'), { textContent: `${button.textContent} plugin is connected through the host boundary.` }))
        }
      }))
      fetch('/api/projection').then(response => response.json()).then(projection => {
        currentProjection = projection
        document.querySelector('#status').textContent = 'Connected'
        summary.textContent = projection.sessions.length + ' OpenCode sessions discovered'
        renderSessions()
      }).catch(() => { document.querySelector('#status').textContent = 'Error'; summary.textContent = 'OpenCode projection unavailable' })
    </script>
  </body>
</html>
