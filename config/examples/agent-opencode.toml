# D00 example: one OpenCode agent daemon.
# Start: agentteams --serve opencode --config config/examples/agent-opencode.toml
# Explicit CLI values (--serve/--ip/--port) win over this file.
#
# Real local defaults. The provider points at the local RouteCodex RCC server on
# port 4444 (see /Volumes/extension/.rcc/config.toml [servers.routecodex_v3_4444]),
# which serves an OpenAI-compatible chat endpoint at http://127.0.0.1:4444/v1.
# No credential reference is required because the local RCC server accepts
# unauthenticated local requests; do not put a real secret in an example.
version = 4

[daemon]
kind = "agent"
id = "reasoner-a"
hostId = "host-a"
accountId = "local"
scopeId = "local"
dataDirectory = "./state/reasoner-a"

[engine]
kind = "opencode"
executable = "/opt/homebrew/bin/opencode"
workspace = "./workspace"

[listen]
ip = "127.0.0.1"
port = 7443

[acp]
enabled = true
required = ["method:session/prompt"]
blacklist = []
clientCapabilities = []
callbackExecutor = "controller"

[relations]
allowed = ["master", "peer"]

[providers.rcc-4444]
protocol = "openai-chat"
apiBaseUrl = "http://127.0.0.1:4444/v1"
label = "Local RCC 4444"
enabled = true

[[models]]
provider = "rcc-4444"
id = "gpt-5.5"
label = "GPT 5.5 (RCC 4444)"
contextWindow = 128000
maxOutputTokens = 16384
tools = true
streaming = true
inputModalities = ["text", "image"]
outputModalities = ["text"]

[[models]]
provider = "rcc-4444"
id = "kk.glm-5.3-flash"
label = "GLM 5.3 Flash (RCC 4444)"
contextWindow = 128000
maxOutputTokens = 8192
tools = true
streaming = true
inputModalities = ["text"]
outputModalities = ["text"]

[model.primary]
provider = "rcc-4444"
model = "gpt-5.5"

[model.backup]
provider = "rcc-4444"
model = "kk.glm-5.3-flash"
