# D00 example: one DSH agent daemon.
# Start: agentteams --serve dsh --config config/examples/agent-dsh.toml
# Explicit CLI values (--serve/--ip/--port) win over this file.
#
# Real local defaults. The provider points at the local RouteCodex RCC server on
# port 4444, which serves an OpenAI-compatible responses endpoint at
# http://127.0.0.1:4444/v1. No credential reference is required for the local
# unauthenticated RCC server.
version = 4

[daemon]
kind = "agent"
id = "reasoner-b"
hostId = "host-b"
accountId = "local"
scopeId = "local"
dataDirectory = "./state/reasoner-b"

[engine]
kind = "dsh"
workspace = "./workspace-dsh"

[listen]
ip = "127.0.0.1"
port = 7445

[acp]
enabled = true
required = []
blacklist = []
clientCapabilities = []
callbackExecutor = "controller"

[relations]
allowed = ["peer"]

[providers.rcc-4444]
protocol = "openai-responses"
apiBaseUrl = "http://127.0.0.1:4444/v1"
label = "Local RCC 4444"
enabled = true

[[models]]
provider = "rcc-4444"
id = "gpt-5.5"
label = "GPT 5.5 (RCC 4444)"
contextWindow = 200000
reasoning = true
streaming = true

[model.primary]
provider = "rcc-4444"
model = "gpt-5.5"
